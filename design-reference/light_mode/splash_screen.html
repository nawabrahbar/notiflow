<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Notiflow - Splash Screen</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            earth: {
              sage: '#CCD5AE',
              linen: '#E9EDC9',
              cream: '#FEFAE0',
              bisque: '#FAEDCD',
              terracotta: '#D4A373',
              dark: '#2C2824',
              muted: '#7A7265'
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
<style>
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes floatRings {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
    }
    .pulse-glow {
      animation: subtlePulse 4s ease-in-out infinite;
    }
    .ring-rotate {
      animation: floatRings 20s linear infinite;
    }
  </style>
</head>
<body class="bg-[#F5F2E9] text-earth-dark min-h-screen flex justify-center items-center font-sans selection:bg-earth-terracotta selection:text-white p-0 sm:py-6">
<!-- Mobile Device Frame Container (390px mobile viewport) -->
<div class="relative w-full max-w-[390px] min-h-screen sm:min-h-[844px] sm:h-[844px] sm:rounded-[48px] sm:shadow-2xl sm:border-[8px] sm:border-[#2C2824]/10 bg-[#FEFAE0] overflow-hidden flex flex-col justify-between items-center px-6 py-8 select-none">
<!-- Ambient Organic Aura in Background -->
<div class="absolute -top-24 -left-16 w-80 h-80 bg-[#E9EDC9] rounded-full blur-3xl opacity-60 pointer-events-none"></div>
<div class="absolute -bottom-28 -right-16 w-80 h-80 bg-[#FAEDCD] rounded-full blur-3xl opacity-70 pointer-events-none"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-[#CCD5AE]/30 rounded-full blur-2xl pointer-events-none"></div>
<!-- Top Status / Quiet Tagline -->

<!-- Central Brand Mark & Identity -->
<main class="flex-1 flex flex-col justify-center items-center text-center my-auto z-10 w-full">
<!-- Emblem -->
<div class="relative flex items-center justify-center mb-7">
<!-- Decorative outer soft orbit ring -->
<div class="absolute w-36 h-36 rounded-full border border-dashed border-[#D4A373]/30 ring-rotate pointer-events-none"></div>
<!-- Ambient aura -->
<div class="absolute inset-0 w-28 h-28 rounded-3xl bg-gradient-to-tr from-[#CCD5AE] to-[#D4A373] opacity-25 blur-lg pulse-glow"></div>

4.5" fill="#CCD5AE" opacity="0.75"></circle><circle cx="410" cy="258" r="4.5" fill="#D4A373" opacity="0.75"></circle><g filter="url(#bellSoftShadow)"><path d="M 256 340 L 256 360" stroke="#B66028" stroke-width="6" stroke-linecap="round"></path><circle cx="256" cy="366" r="22" fill="url(#clapperGrad)" stroke="#FFFFFF" stroke-width="3"></circle><circle cx="256" cy="366" r="22" fill="none" stroke="#D4A373" stroke-width="2" stroke-opacity="0.8"></circle><circle cx="256" cy="366" r="7" fill="#B66028" opacity="0.9"></circle><path d="M 236 156 C 236 138 245 128 256 128 C 267 128 276 138 276 156" fill="none" stroke="url(#terraBell)" stroke-width="8" stroke-linecap="round"></path><path d="M 256 156 C 208 156 182 196 178 256 C 176 286 162 310 144 330 C 137 337 141 348 150 348 L 362 348 C 371 348 375 337 368 330 C 350 310 336 286 334 256 C 330 196 304 156 256 156 Z" fill="url(#terraBell)"></path><path d="M 248 165 C 214 172 194 206 190 256 C 188 278 178 298 166 318" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.45"></path><path d="M 148 334 C 180 314 212 268 250 270 C 292 272 324 236 334 196 C 332 190 326 187 320 196 C 304 224 274 252 236 250 C 192 248 164 298 146 328 Z" fill="#FEFAE0" opacity="0.32"></path><path d="M 164 343 C 202 328 238 326 276 332 C 312 338 342 341 356 343 L 348 348 L 166 348 Z" fill="#CCD5AE" opacity="0.9"></path><rect x="146" y="344" width="220" height="8" rx="4" fill="#FAEDCD" opacity="0.95"></rect><rect x="146" y="344" width="220" height="8" rx="4" fill="none" stroke="#D4A373" stroke-width="1.2" opacity="0.6"></rect></g><rect x="224" y="452" width="64" height="6" rx="3" fill="#D4A373" opacity="0.45"></rect></svg></div>
</div>
<!-- Title & Typographic Hierarchy -->
<h1 class="font-serif text-[38px] font-semibold tracking-tight text-[#2C2824] mb-2.5 leading-tight">
        Notiflow
      </h1>
<p class="text-[15px] text-[#7A7265] leading-relaxed max-w-[240px] font-normal mb-8">
        Silence the noise.<br>
<span class="font-serif italic text-[#2C2824]/90 text-[17px]">Protect what matters.</span>
</p>
<!-- Minimal Progress / Loading Indicator -->
<div class="w-44 flex flex-col items-center gap-2.5">
<div class="w-full h-1 bg-[#FAEDCD] rounded-full overflow-hidden border border-[#D4A373]/20">
<div class="h-full bg-gradient-to-r from-[#CCD5AE] to-[#D4A373] w-2/3 rounded-full animate-pulse"></div>
</div>
<span class="text-[12px] font-medium text-[#7A7265]/80 tracking-wide">
          Waking on-device shield…
        </span>
</div>
</main>
<!-- Bottom Privacy Footnote -->
<footer class="w-full pb-3 flex flex-col items-center gap-1.5 z-10">

</footer>
</div>










</body></html>
