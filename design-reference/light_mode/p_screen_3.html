<script>
  (function() {
    const cards = document.querySelectorAll('.protocol-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.classList.remove('bg-surface-container-lowest', 'bg-surface-container-low');
          c.classList.add('bg-surface-container-lowest', 'opacity-90');
          const indicator = c.querySelector('.selection-indicator');
          indicator.className = 'selection-indicator text-outline flex items-center justify-center';
          indicator.innerHTML = '<span class="material-symbols-outlined text-[24px]">radio_button_unchecked</span>';
        });

        card.classList.remove('opacity-90');
        const activeIndicator = card.querySelector('.selection-indicator');
        activeIndicator.className = 'selection-indicator text-primary flex items-center justify-center';
        activeIndicator.innerHTML = '<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
      });
    });
  })();
