<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Notiflow - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: '#101412',
            'surface-container': '#1c201e',
            'surface-container-high': '#272b29',
            'surface-container-low': '#181c1a',
            primary: '#fcbc76',
            'primary-container': '#dda15e',
            secondary: '#becca3',
            'on-surface': '#e0e3e0',
            'on-surface-variant': '#d5c3b4',
            outline: '#9e8e80',
            'outline-variant': '#514539'
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
<style>
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes floatRings {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulse-glow {
      animation: subtlePulse 4s ease-in-out infinite;
    }
    .ring-rotate {
      animation: floatRings 24s linear infinite;
    }
  </style>
</head>
<body class="bg-[#090C0B] text-[#e0e3e0] min-h-screen flex justify-center items-center font-sans selection:bg-[#dda15e] selection:text-[#101412] p-0 sm:py-6">
<!-- Mobile Device Frame Container (390px mobile viewport) -->
<div class="relative w-full max-w-[390px] min-h-screen sm:min-h-[844px] sm:h-[844px] sm:rounded-[48px] sm:shadow-2xl sm:border-[8px] sm:border-[#272b29]/50 bg-gradient-to-b from-[#0C100E] via-[#101513] to-[#141A17] overflow-hidden flex flex-col justify-between items-center px-6 py-8 select-none">
<!-- Ambient Organic Aura in Background -->
<div class="absolute -top-24 -left-16 w-80 h-80 bg-[#1c2820] rounded-full blur-3xl opacity-35 pointer-events-none"></div>
<div class="absolute -bottom-28 -right-16 w-80 h-80 bg-[#2b2216] rounded-full blur-3xl opacity-30 pointer-events-none"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[320px] h-[320px] bg-[#dda15e]/10 rounded-full blur-3xl pointer-events-none"></div>

<main class="flex-1 flex flex-col justify-center items-center text-center my-auto z-10 w-full">

<div class="relative flex items-center justify-center mb-7">
<!-- Decorative outer soft orbit ring -->
<div class="absolute w-36 h-36 rounded-full border border-dashed border-[#dda15e]/25 ring-rotate pointer-events-none"></div>
<!-- Ambient aura -->
<div class="absolute inset-0 w-28 h-28 rounded-3xl bg-gradient-to-tr from-[#dda15e]/20 to-[#a7d4a3]/15 opacity-40 blur-xl pulse-glow"></div>

</div>
<!-- Title & Typographic Hierarchy -->
<h1 class="font-serif text-[38px] font-semibold tracking-tight text-[#F4F5F0] mb-2.5 leading-tight">
        Notiflow
      </h1>
<p class="text-[15px] text-[#C5CEC7] leading-relaxed max-w-[240px] font-normal mb-8">
        Silence the noise.<br>
<span class="font-serif italic text-[#C5CEC7] text-[17px]">Protect what matters.</span>
</p>
<!-- Minimal Progress / Loading Indicator -->
<div class="w-44 flex flex-col items-center gap-2.5">
<div class="w-full h-1 bg-[#252F29] rounded-full overflow-hidden border border-[#514539]/30">
<div class="h-full bg-gradient-to-r from-[#DDA15E] to-[#fcbc76] w-2/3 rounded-full animate-pulse"></div>
</div>
<span class="text-[12px] font-medium text-[#8E9B90] tracking-wide">
          Waking on-device shield…
        </span>
</div>
</main>
<!-- Bottom Privacy Footnote -->
<footer class="w-full pb-3 flex flex-col items-center gap-1.5 z-10">

</footer>
</div>






</body></html>
