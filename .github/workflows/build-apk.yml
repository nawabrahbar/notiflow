name: Build & Release Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Notiflow Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter unit & widget tests
        run: |
          set +e
          flutter test --reporter expanded > test_results.txt 2>&1
          TEST_EXIT_CODE=$?
          set -e
          mkdir /tmp/ci-logs-repo
          cd /tmp/ci-logs-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b ci-logs
          cp $GITHUB_WORKSPACE/test_results.txt ./
          git add test_results.txt
          git commit -m "ci test logs [skip ci]" || true
          git push -f origin ci-logs || true
          cd $GITHUB_WORKSPACE
          exit $TEST_EXIT_CODE

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Release signing configured with upload-keystore.jks"
          else
            echo "No KEYSTORE_BASE64 secret found; falling back to debug signing"
          fi

      - name: Build Android Release APK & Play Store App Bundle (.aab)
        run: |
          set +e
          flutter build apk --release > build_apk.log 2>&1
          APK_CODE=$?
          flutter build appbundle --release > build_aab.log 2>&1
          AAB_CODE=$?
          set -e
          mkdir -p /tmp/ci-logs-repo-2
          cd /tmp/ci-logs-repo-2
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b ci-logs
          cp $GITHUB_WORKSPACE/build_apk.log ./
          cp $GITHUB_WORKSPACE/build_aab.log ./
          git add build_apk.log build_aab.log
          git commit -m "ci build logs [skip ci]" || true
          git push -f origin ci-logs || true
          cd $GITHUB_WORKSPACE
          if [ $APK_CODE -ne 0 ]; then
            cat build_apk.log | tail -n 100
            exit $APK_CODE
          fi
          if [ $AAB_CODE -ne 0 ]; then
            cat build_aab.log | tail -n 100
            exit $AAB_CODE
          fi

      - name: Prepare APK & AAB artifacts
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp build/app/outputs/flutter-apk/app-release.apk "notiflow-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "notiflow-latest.apk"
          cp build/app/outputs/bundle/release/app-release.aab "notiflow-v${VERSION}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "notiflow-latest.aab"

      - name: Upload APK & AAB to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notiflow-release-${{ steps.meta.outputs.version }}
          path: |
            notiflow-v${{ steps.meta.outputs.version }}.apk
            notiflow-latest.apk
            notiflow-v${{ steps.meta.outputs.version }}.aab
            notiflow-latest.aab
          retention-days: 3
          if-no-files-found: error

      - name: Publish APK & AAB to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-b${{ github.run_number }}
          name: Notiflow v${{ steps.meta.outputs.version }} (Build #${{ github.run_number }})
          body: |
            ### Notiflow Android Release (v${{ steps.meta.outputs.version }})
            - **📲 Direct Phone Install (`.apk`)**: Download `notiflow-v${{ steps.meta.outputs.version }}.apk` (or `notiflow-latest.apk`) to install directly on your Android phone.
            - **🏪 Google Play Console Upload (`.aab`)**: Download `notiflow-v${{ steps.meta.outputs.version }}.aab` (or `notiflow-latest.aab`) to upload to Google Play Console.
            - **Commit**: `${{ github.sha }}`
          files: |
            notiflow-v${{ steps.meta.outputs.version }}.apk
            notiflow-latest.apk
            notiflow-v${{ steps.meta.outputs.version }}.aab
            notiflow-latest.aab
          draft: false
          prerelease: false
