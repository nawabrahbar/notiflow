name: Build & Release Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Notiflow Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK artifacts
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp build/app/outputs/flutter-apk/app-release.apk "notiflow-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "notiflow-latest.apk"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notiflow-apk-${{ steps.meta.outputs.version }}
          path: |
            notiflow-v${{ steps.meta.outputs.version }}.apk
            notiflow-latest.apk
          retention-days: 3
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-b${{ github.run_number }}
          name: Notiflow v${{ steps.meta.outputs.version }} (Build #${{ github.run_number }})
          body: |
            ### Notiflow Android Release APK (v${{ steps.meta.outputs.version }})
            - **Direct Phone Install**: Download `notiflow-v${{ steps.meta.outputs.version }}.apk` below on your Android phone and tap to install.
            - **Commit**: `${{ github.sha }}`
          files: |
            notiflow-v${{ steps.meta.outputs.version }}.apk
            notiflow-latest.apk
          draft: false
          prerelease: false
